[platformio]
; `pio run` builds the firmware; the host suite is explicit: `pio test -e native`
default_envs = featheresp32-s2

[env:featheresp32-s2]
platform = espressif32@8.0.0            ; ships arduino core 3.3.12 / IDF 5.5 (pin exact — research K, #12769 watch)
board = featheresp32-s2                 ; NOPSRAM variant, CDC-on-boot (research K verified)
framework = arduino
board_build.partitions = partitions.csv ; replaces board-default tinyuf2 4MB csv (reclaims UF2/OTA reservations)
board_build.filesystem = littlefs       ; label "storage" (settings.json only; web assets are PROGMEM)
build_flags =
    -D ARDUINO_LOOP_STACK_SIZE=8192     ; JSON+WiFi handlers on 3.x need > default
    -D CONFIG_FREERTOS_HZ=1000          ; 1 ms ticks (only affects vTaskDelay; harmless)
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit Neopixel @ 1.12.2 ; RMT path on IDF5 core; exact pin (research C; fallback documented)
    bblanchon/ArduinoJson @ 7.4.2       ; MIT verified in research F; exact pin

[env:native]
platform = native
build_type = test                       ; consumed via `pio test -e native`
; Cores must LINK into the tests, so src is built but narrowed to the pure
; logic only (device modules excluded) — plan's test_build_src=no would
; compile headers only and leave the cores undefined at link time.
test_build_src = yes
build_src_filter =
    -<*>
    +<core/>
    +<settings.cpp>
    +<alert_stub.cpp>
build_flags = -std=gnu++17
    -D UNIT_TEST
    -Isrc
    ; ArduinoJson: defining ARDUINO=0 still selects its Arduino.h path, so
    ; leave ARDUINO undefined and switch the Arduino integrations off instead.
    -D ARDUINOJSON_ENABLE_ARDUINO_STRING=0
    -D ARDUINOJSON_ENABLE_ARDUINO_STREAM=0
    -D ARDUINOJSON_ENABLE_ARDUINO_PRINT=0
    -D ARDUINOJSON_ENABLE_PROGMEM=0
    -D UNITY_INCLUDE_DOUBLE
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2       ; header-only; used for real in tests
